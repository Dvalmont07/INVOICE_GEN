<nav class="navbar">
  <div class="navbar-brand">
    <a routerLink="/invoice">InvoiceGen</a>
  </div>
  
  <button class="mobile-toggle" (click)="toggleMobileMenu()">
    ☰
  </button>

  <ul class="navbar-links" [class.open]="mobileMenuOpen">
    <li><a routerLink="/invoice" routerLinkActive="active" (click)="mobileMenuOpen = false">Gerador</a></li>
    <li><a routerLink="/management/history" routerLinkActive="active" (click)="mobileMenuOpen = false">Histórico</a></li>
    <li><a routerLink="/management/clients" routerLinkActive="active" (click)="mobileMenuOpen = false">Clientes</a></li>
    <li><a routerLink="/management/consultants" routerLinkActive="active" (click)="mobileMenuOpen = false">Consultores</a></li>
